<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <!-- Body gradient — classic Mustang red/orange -->
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="40%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <linearGradient id="bodyBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991100"/>
      <stop offset="100%" stop-color="#550000"/>
    </linearGradient>
    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6633"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(180,220,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(60,120,200,0.4)"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="60%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <!-- Rim gradient -->
    <radialGradient id="rimGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ddd"/>
      <stop offset="50%" stop-color="#888"/>
      <stop offset="100%" stop-color="#444"/>
    </radialGradient>
    <!-- Headlight glow -->
    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="60%" stop-color="#ffd740" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>
    <!-- Taillight -->
    <radialGradient id="taillightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <!-- Body shine -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Underbody shadow -->
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <!-- Ground shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M60,148 L60,95 Q65,60 120,52 L190,42 Q240,30 280,30 Q320,30 360,38 L420,50 Q480,60 510,80 L530,95 L540,110 L540,148 Z"/>
    </clipPath>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="185" rx="260" ry="18" fill="url(#groundShadow)" filter="url(#blur4)"/>

  <!-- ── Main body lower sill ──────────────────────────────────────────── -->
  <path d="M62,148 Q80,160 140,163 L460,163 Q520,160 538,148 L540,142 L60,142 Z"
        fill="url(#bodyBottom)"/>

  <!-- ── Main body upper ──────────────────────────────────────────────── -->
  <path d="M60,148 L60,100 Q68,65 125,55 L195,44 Q242,33 282,32 Q322,32 362,40 L422,52 Q478,63 510,82 L530,98 L540,112 L540,148 Z"
        fill="url(#bodyTop)"/>

  <!-- Body shine highlight -->
  <path d="M80,95 Q120,55 200,44 L360,40 Q430,50 500,80 L510,72 Q460,48 360,34 L200,36 Q110,46 74,88 Z"
        fill="url(#shineGrad)" opacity="0.6"/>

  <!-- ── Roof & pillars ─────────────────────────────────────────────────── -->
  <path d="M175,56 Q210,24 270,20 L360,20 Q400,20 430,36 L460,56 Z"
        fill="url(#roofGrad)"/>

  <!-- A-pillar left -->
  <path d="M175,56 L200,56 L230,20 L210,20 Z" fill="#991100" opacity="0.8"/>
  <!-- C-pillar right -->
  <path d="M430,36 L460,56 L445,56 L418,38 Z" fill="#880000" opacity="0.8"/>

  <!-- Roof shine -->
  <path d="M215,22 Q270,16 355,20 L360,20 Q400,20 428,34 L425,30 Q395,18 358,17 Q270,14 210,20 Z"
        fill="rgba(255,255,255,0.3)"/>

  <!-- ── Windshield ─────────────────────────────────────────────────────── -->
  <path d="M200,56 L230,20 L355,20 L380,56 Z"
        fill="url(#glassGrad)" opacity="0.9"/>
  <!-- Windshield glare -->
  <path d="M210,53 L235,23 L290,23 L270,53 Z"
        fill="rgba(255,255,255,0.25)"/>

  <!-- ── Rear window ────────────────────────────────────────────────────── -->
  <path d="M380,56 L355,20 L410,20 L430,36 L460,56 Z"
        fill="url(#glassGrad)" opacity="0.75"/>

  <!-- ── Side windows ───────────────────────────────────────────────────── -->
  <!-- Front side window -->
  <path d="M380,56 L430,36 L460,56 Z"
        fill="url(#glassGrad)" opacity="0.7"/>

  <!-- ── Door lines ─────────────────────────────────────────────────────── -->
  <line x1="305" y1="56" x2="302" y2="145" stroke="#aa1100" stroke-width="1.5" opacity="0.7"/>

  <!-- ── Hood & front fascia ───────────────────────────────────────────── -->
  <!-- Hood -->
  <path d="M60,100 Q68,65 125,55 L175,56 L175,60 Q125,58 80,98 Z"
        fill="#cc2200"/>
  <!-- Hood scoop / vent line -->
  <path d="M90,80 Q105,65 140,58 L168,57" stroke="rgba(255,100,50,0.6)" stroke-width="1.5" fill="none"/>
  <!-- Front bumper -->
  <path d="M60,130 Q58,148 62,155 L62,148 L60,130 Z" fill="#881100"/>
  <path d="M60,140 Q55,148 58,160 L65,160 Q62,150 63,140 Z" fill="#771100"/>

  <!-- ── Grille ──────────────────────────────────────────────────────────── -->
  <rect x="62" y="120" width="22" height="18" rx="3" fill="#111" opacity="0.9"/>
  <!-- Grille bars -->
  <line x1="62" y1="124" x2="84" y2="124" stroke="#333" stroke-width="0.8"/>
  <line x1="62" y1="128" x2="84" y2="128" stroke="#333" stroke-width="0.8"/>
  <line x1="62" y1="132" x2="84" y2="132" stroke="#333" stroke-width="0.8"/>
  <line x1="69" y1="120" x2="69" y2="138" stroke="#333" stroke-width="0.8"/>
  <line x1="76" y1="120" x2="76" y2="138" stroke="#333" stroke-width="0.8"/>
  <!-- Mustang galloping pony badge -->
  <text x="70" y="131" font-size="9" fill="#c0a020" font-family="serif" font-weight="bold" text-anchor="middle">🐎</text>

  <!-- ── Headlights ────────────────────────────────────────────────────── -->
  <!-- Outer headlight glow -->
  <ellipse cx="72" cy="108" rx="16" ry="10" fill="url(#headlightGlow)" filter="url(#blur2)" opacity="0.9"/>
  <!-- Headlight housing -->
  <path d="M60,102 Q64,96 80,98 L84,106 Q72,108 62,110 Z" fill="#222" stroke="#444" stroke-width="0.8"/>
  <!-- Headlight lens -->
  <path d="M62,103 Q65,98 78,100 L81,106 Q70,107 64,108 Z" fill="rgba(255,240,180,0.9)"/>
  <!-- DRL strip -->
  <path d="M62,112 Q68,110 84,110" stroke="#fffde7" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- ── Rear lights & trunk ────────────────────────────────────────────── -->
  <!-- Trunk lid -->
  <path d="M490,80 L540,112 L540,120 L492,88 Z" fill="#bb2200"/>
  <!-- Tail light housing -->
  <path d="M528,105 L540,112 L540,135 L528,130 Z" fill="#111"/>
  <!-- Tail light -->
  <path d="M530,107 L539,113 L539,132 L530,128 Z" fill="url(#taillightGrad)" opacity="0.95"/>
  <!-- Tail light reflection lines -->
  <line x1="532" y1="110" x2="538" y2="114" stroke="rgba(255,80,80,0.5)" stroke-width="1"/>
  <line x1="532" y1="116" x2="538" y2="120" stroke="rgba(255,80,80,0.5)" stroke-width="1"/>
  <line x1="532" y1="122" x2="538" y2="126" stroke="rgba(255,80,80,0.5)" stroke-width="1"/>

  <!-- ── Side body character lines ─────────────────────────────────────── -->
  <path d="M84,110 Q200,108 305,108 Q420,108 510,98"
        stroke="rgba(255,80,30,0.5)" stroke-width="1.2" fill="none"/>
  <path d="M80,128 Q200,126 305,126 Q430,126 520,118"
        stroke="rgba(150,20,0,0.6)" stroke-width="1" fill="none"/>

  <!-- ── Door handle ───────────────────────────────────────────────────── -->
  <rect x="255" y="100" width="28" height="6" rx="3" fill="#cc3300" stroke="rgba(255,120,60,0.6)" stroke-width="0.8"/>
  <rect x="370" y="102" width="22" height="5" rx="2.5" fill="#bb2200" stroke="rgba(255,100,40,0.5)" stroke-width="0.8"/>

  <!-- ── Rocker panel / sill ───────────────────────────────────────────── -->
  <path d="M100,155 L480,155 L490,163 L92,163 Z" fill="#770000"/>

  <!-- ── Front wheel arch ──────────────────────────────────────────────── -->
  <path d="M88,155 Q88,105 140,90 Q192,75 200,128 L200,155 Z" fill="#aa1100"/>
  <ellipse cx="148" cy="158" rx="46" ry="46" fill="#aa1100"/>

  <!-- ── Rear wheel arch ───────────────────────────────────────────────── -->
  <path d="M380,138 Q385,90 435,82 Q490,76 500,130 L500,155 L380,155 Z" fill="#aa1100"/>
  <ellipse cx="440" cy="158" rx="46" ry="46" fill="#aa1100"/>

  <!-- ══ FRONT WHEEL ════════════════════════════════════════════════════ -->
  <g id="front-wheel" transform="translate(148,158)">
    <!-- Tyre -->
    <circle r="44" fill="#1a1a1a"/>
    <circle r="40" fill="#111"/>
    <!-- Tyre tread rings -->
    <circle r="43" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <circle r="38" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Rim -->
    <circle r="30" fill="url(#rimGrad)"/>
    <!-- Hub cap -->
    <circle r="10" fill="#888"/>
    <circle r="7"  fill="#555"/>
    <circle r="4"  fill="#aaa"/>
    <!-- Spoke set 1 (5-spoke alloy) -->
    <line x1="0"   y1="-28" x2="0"   y2="-10" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="26"  y1="-8"  x2="9"   y2="-3"  stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="16"  y1="23"  x2="5"   y2="8"   stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="-16" y1="23"  x2="-5"  y2="8"   stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="-26" y1="-8"  x2="-9"  y2="-3"  stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <!-- Spoke shading -->
    <line x1="0"   y1="-28" x2="0"   y2="-10" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="26"  y1="-8"  x2="9"   y2="-3"  stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Brake disc glimpse -->
    <circle r="18" fill="none" stroke="#444" stroke-width="2" opacity="0.5"/>
    <!-- Rim ring -->
    <circle r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <!-- Tyre sidewall text -->
    <text x="-18" y="36" font-size="4" fill="#444" font-family="Arial" transform="rotate(-20)">MUSTANG GT</text>
  </g>

  <!-- ══ REAR WHEEL ════════════════════════════════════════════════════ -->
  <g id="rear-wheel" transform="translate(440,158)">
    <circle r="44" fill="#1a1a1a"/>
    <circle r="40" fill="#111"/>
    <circle r="43" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <circle r="38" fill="none" stroke="#2a2a2a" stroke-width="1"/>
    <circle r="30" fill="url(#rimGrad)"/>
    <circle r="10" fill="#888"/>
    <circle r="7"  fill="#555"/>
    <circle r="4"  fill="#aaa"/>
    <line x1="0"   y1="-28" x2="0"   y2="-10" stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="26"  y1="-8"  x2="9"   y2="-3"  stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="16"  y1="23"  x2="5"   y2="8"   stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="-16" y1="23"  x2="-5"  y2="8"   stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="-26" y1="-8"  x2="-9"  y2="-3"  stroke="#bbb" stroke-width="4" stroke-linecap="round"/>
    <line x1="0"   y1="-28" x2="0"   y2="-10" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
    <circle r="18" fill="none" stroke="#444" stroke-width="2" opacity="0.5"/>
    <circle r="30" fill="none" stroke="#999" stroke-width="1.5"/>
    <text x="-18" y="36" font-size="4" fill="#444" font-family="Arial" transform="rotate(-20)">MUSTANG GT</text>
  </g>

  <!-- ── Exhaust tips ───────────────────────────────────────────────────── -->
  <ellipse cx="510" cy="162" rx="6" ry="4" fill="#333" stroke="#555" stroke-width="0.8"/>
  <ellipse cx="523" cy="162" rx="6" ry="4" fill="#333" stroke="#555" stroke-width="0.8"/>
  <ellipse cx="510" cy="162" rx="4" ry="2.5" fill="#222"/>
  <ellipse cx="523" cy="162" rx="4" ry="2.5" fill="#222"/>

  <!-- ── Side mirror ───────────────────────────────────────────────────── -->
  <path d="M178,72 L168,68 L165,76 L176,78 Z" fill="#cc2200" stroke="#aa1100" stroke-width="0.8"/>
  <path d="M170,70 L166,69 L165,75 L170,75 Z" fill="url(#glassGrad)" opacity="0.8"/>

  <!-- ── Ford badge on rear ─────────────────────────────────────────────── -->
  <ellipse cx="520" cy="96" rx="12" ry="7" fill="#003399" stroke="#6699ff" stroke-width="1"/>
  <text x="520" y="99" font-size="6" fill="white" font-family="serif" font-style="italic" font-weight="bold" text-anchor="middle">Ford</text>

  <!-- ── Underbody / floor pan shadow ─────────────────────────────────── -->
  <path d="M90,163 L500,163 L510,170 L80,170 Z" fill="url(#shadowGrad)" opacity="0.5"/>
</svg>
