<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dark.css">
    <link rel="stylesheet" href="intro.css">

<body>
    <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loader-logo">DANNY</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <!-- Particle canvas background -->
    <canvas id="particle-canvas"></canvas>

    <!-- Glowing cursor -->
    <div id="cursor-glow"></div>

    <!-- Scroll progress bar -->
    <div id="scroll-progress"></div>

    <!-- Back to top button -->
    <button id="back-to-top" aria-label="Back to top">↑</button>

    <!-- Page transition overlay -->
    <div id="rr-transition">
        <div class="rr-road-line"></div>
        <div class="rr-car">
            <img src="images/mustang.svg" alt="Mustang" class="mustang-img" />
            <span class="rr-label">Loading…</span>
        </div>
    </div>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>Danny</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-inner">
            <div class="hero-content">
                <h2 data-type-title="Welcome to My Portfolio">Welcome to My Portfolio</h2>
                <p>Full-stack developer & creative problem solver</p>
                <a href="about.html" class="btn">Learn More About Me</a>
            </div>
            <div class="hero-image">
                <img src="images/danset.jpg" alt="Danny" />
            </div>
        </div>
    </section>

    <!-- Call to Action -->
    <section class="cta">
        <div class="container">
            <h3>Ready to work together?</h3>
            <a href="contact.html" class="btn btn-secondary">Get In Touch</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Danny. All rights reserved.</p>
            <div class="social-links">
                <a href="https://github.com/mugabidansey2-dotcom" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/mugabi-dunset-696808397/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a href="https://www.instagram.com/dansetdannie/" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="https://www.threads.com/@dansetdannie" target="_blank" rel="noopener noreferrer">Threads</a>
                <a href="https://www.behance.net/mugabidansey" target="_blank" rel="noopener noreferrer">Behance</a>
            </div>
        </div>
    </footer>
    <script src="intro.js"></script>
    <script src="superpowers.js"></script>
    <script src="typing.js"></script>
